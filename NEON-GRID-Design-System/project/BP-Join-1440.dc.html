<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Join — 1440 desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&amp;family=Rajdhani:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#05060A}</style>
</helmet>
<div style="width: 1440px; height: 1000px; overflow: hidden; background: #05060A">
<dc-import name="Join" device="{{dv}}" phase="{{ph}}" hint-size="1440px,1000px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() { return { dv: 'desktop', ph: 'empty' }; }
}
</script>
</body>
</html>
