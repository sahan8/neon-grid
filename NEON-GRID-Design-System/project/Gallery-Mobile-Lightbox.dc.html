<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gallery — mobile swipe lightbox</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&amp;family=Rajdhani:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#05060A}</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: #05060A">
<dc-import name="Gallery" mobile="{{m}}" filter="{{f}}" hover="{{h}}" lightbox="{{l}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { m: true, f: 'ALL', h: -1, l: 2 }; }
}
</script>
</body>
</html>
