<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>05 / Gallery</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&amp;family=Rajdhani:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#05060A}
.ng-noise{position:absolute;inset:0;pointer-events:none;background-image:url(/_blob/4471ec4b76afa1f4abfdc8c2ea75b053);background-size:240px;opacity:.03;z-index:90}
.ng-scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(232,241,255,.04) 0 2px,transparent 2px 4px);z-index:89}
.tile{cursor:pointer;display:block;width:100%;padding:0;border:0;background:transparent;text-align:left;position:relative}
.tile:focus-visible{outline:2px solid #00F0FF;outline-offset:3px;box-shadow:0 0 8px #00F0FF,0 0 24px rgba(0,240,255,.5)}
.t-img{transition:transform 600ms cubic-bezier(.16,1,.3,1)}
.t-scan{opacity:0;transition:opacity 150ms}
.t-cap{transform:translateY(100%);transition:transform 300ms cubic-bezier(.16,1,.3,1)}
.t-frame{transition:border-color 150ms,box-shadow 300ms}
.tile:hover .t-img,.tile:focus-visible .t-img,.tile.is-hover .t-img{transform:scale(1.05)}
.tile:hover .t-scan,.tile:focus-visible .t-scan,.tile.is-hover .t-scan{opacity:1}
.tile:hover .t-cap,.tile:focus-visible .t-cap,.tile.is-hover .t-cap{transform:none}
.tile:hover .t-frame,.tile.is-hover .t-frame{border-color:#00F0FF !important;box-shadow:0 0 8px rgba(0,240,255,.6),0 0 24px rgba(0,240,255,.25)}
.t-scan{animation:tscan 1200ms linear infinite}
@keyframes tscan{from{background-position:0 0}to{background-position:0 24px}}
.tab{cursor:pointer;transition:all 150ms}
.tab:hover{color:#E8F1FF !important}
.tab:focus-visible,.lb-btn:focus-visible,.lb-th:focus-visible{outline:2px solid #00F0FF;outline-offset:3px;box-shadow:0 0 8px #00F0FF,0 0 24px rgba(0,240,255,.5)}
.lb-btn{cursor:pointer;transition:all 150ms}
.lb-btn:hover{border-color:#00F0FF !important;color:#E8F1FF !important;box-shadow:0 0 8px #00F0FF,0 0 24px rgba(0,240,255,.5)}
.lb-th{cursor:pointer}
.lb-in{animation:lbin 300ms cubic-bezier(.16,1,.3,1) 1}
@keyframes lbin{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.mas{column-gap:var(--g)}
.mas > *{break-inside:avoid;margin-bottom:var(--g)}
@media (prefers-reduced-motion:reduce){.t-img,.t-cap{transition:opacity 150ms}.tile:hover .t-img,.tile.is-hover .t-img{transform:none}.t-scan{animation:none}.lb-in{animation:none}}
</style>
</helmet>
<section id="gallery" aria-label="Gallery" style="width: {{W}}px; height: {{H}}px; position: relative; overflow: hidden; background: #05060A; color: #E8F1FF; font-family: 'Rajdhani', 'Inter', system-ui, sans-serif; font-size: 16px; line-height: 1.6">
<div class="ng-scan"></div>
<div class="ng-noise"></div>

<header style="position: relative; z-index: 2; padding: {{hdrPad}}; display: flex; flex-direction: column; gap: {{hdrGap}}px">
<div style="display: flex; align-items: center; gap: 16px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: {{idxFs}}px; letter-spacing: 0.12em; color: #00F0FF; white-space: nowrap">05 / GALLERY</span>
<span aria-hidden="true" style="flex: 1; height: 1px; background: linear-gradient(90deg, rgba(0,240,255,0.6), rgba(0,240,255,0.12) 40%, rgba(0,240,255,0))"></span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; color: #8A93A8; white-space: nowrap">{{countLabel}}</span>
</div>
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap">
<h2 style="margin: 0; font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: {{h2Fs}}px; line-height: 1.1; letter-spacing: 0.08em; text-transform: uppercase">Captured frames</h2>
<div role="tablist" aria-label="Filter gallery" style="display: flex; gap: 4px; flex-wrap: wrap">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<button type="button" class="tab" role="tab" aria-selected="{{t.selStr}}" onClick="{{t.pick}}" style="height: 44px; padding: 0 {{tabPad}}px; display: inline-flex; align-items: center; gap: 8px; background: {{t.bg}}; border: 1px solid {{t.border}}; color: {{t.color}}; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.14em; box-shadow: {{t.glow}}">{{t.label}}<span style="font-size: 10px; color: {{t.countC}}">{{t.count}}</span></button>
</sc-for>
</div>
</div>
</header>

<div class="mas" style="position: relative; z-index: 2; margin-top: {{gridTop}}px; padding: 0 {{padX}}px; column-count: {{cols}}; --g: {{gap}}px">
<sc-for list="{{shown}}" as="g" hint-placeholder-count="9">
<button type="button" class="tile {{g.hoverCls}}" aria-label="Open image {{g.num}} of 9: {{g.title}}" onClick="{{g.open}}">
<span class="t-frame" style="display: block; position: relative; height: {{g.h}}px; overflow: hidden; border: 1px solid rgba(0,240,255,0.15); background: #0B0E17">
<span class="t-img" role="img" aria-label="{{g.alt}}" style="position: absolute; inset: 0; display: block; background: {{g.scene}}"></span>
<span class="t-scan" aria-hidden="true" style="position: absolute; inset: 0; display: block; background: repeating-linear-gradient(to bottom, rgba(0,240,255,0.14) 0 1px, rgba(0,0,0,0) 1px 4px), linear-gradient(to top, rgba(5,6,10,0.75), rgba(5,6,10,0) 50%)"></span>
<span aria-hidden="true" style="position: absolute; left: 10px; top: 10px; height: 22px; padding: 0 8px; display: inline-flex; align-items: center; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.14em; color: {{g.catC}}; background: rgba(5,6,10,0.7); border: 1px solid {{g.catC}}">{{g.cat}}</span>
<span class="t-cap" style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 2px; padding: 12px 12px 10px; background: rgba(5,6,10,0.88); border-top: 1px solid #00F0FF; font-family: 'JetBrains Mono', monospace">
<span style="font-size: 12px; letter-spacing: 0.12em; color: #E8F1FF">#{{g.num}} · {{g.titleUp}}</span>
<span style="font-size: 10px; letter-spacing: 0.12em; color: #8A93A8">{{g.meta}}</span>
</span>
</span>
</button>
</sc-for>
</div>

<!-- LIGHTBOX -->
<sc-if value="{{lbOpen}}" hint-placeholder-val="{{ false }}">
<div role="dialog" aria-modal="true" aria-label="Image viewer" onTouchStart="{{tStart}}" onTouchEnd="{{tEnd}}" style="position: absolute; z-index: 60; inset: 0; background: rgba(5,6,10,0.96); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: flex; flex-direction: column">
<div style="height: 64px; flex: none; padding: 0 {{lbPadX}}px; display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid rgba(0,240,255,0.15)">
<span aria-live="polite" style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: {{cntFs}}px; letter-spacing: 0.06em"><span style="color: #00F0FF">{{lbNum}}</span><span style="color: #8A93A8"> / 09</span></span>
<sc-if value="{{desktop}}" hint-placeholder-val="{{ true }}">
<div aria-hidden="true" style="display: flex; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.14em; color: #8A93A8">
<span style="display: inline-flex; align-items: center; gap: 6px"><kbd style="min-width: 22px; height: 22px; padding: 0 4px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid rgba(0,240,255,0.4); color: #E8F1FF; font-family: inherit">←</kbd><kbd style="min-width: 22px; height: 22px; padding: 0 4px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid rgba(0,240,255,0.4); color: #E8F1FF; font-family: inherit">→</kbd>NAVIGATE</span>
<span style="display: inline-flex; align-items: center; gap: 6px; margin-left: 12px"><kbd style="height: 22px; padding: 0 6px; display: inline-flex; align-items: center; border: 1px solid rgba(0,240,255,0.4); color: #E8F1FF; font-family: inherit">ESC</kbd>CLOSE</span>
<span style="display: inline-flex; align-items: center; gap: 6px; margin-left: 12px"><kbd style="min-width: 22px; height: 22px; padding: 0 4px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid rgba(0,240,255,0.4); color: #E8F1FF; font-family: inherit">F</kbd>FULLSCREEN</span>
</div>
</sc-if>
<sc-if value="{{mobile}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.16em; color: #8A93A8">SWIPE ← →</span></sc-if>
<button type="button" class="lb-btn" aria-label="Close viewer" onClick="{{close}}" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 1px solid rgba(0,240,255,0.35); color: #00F0FF"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"></path></svg></button>
</div>
<div style="flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; padding: {{stagePad}}">
<sc-if value="{{desktop}}" hint-placeholder-val="{{ true }}">
<button type="button" class="lb-btn" aria-label="Previous image" onClick="{{prev}}" style="position: absolute; left: 32px; top: 50%; margin-top: -28px; width: 56px; height: 56px; display: inline-flex; align-items: center; justify-content: center; background: rgba(5,6,10,0.6); border: 1px solid rgba(0,240,255,0.35); color: #00F0FF"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 12H5M11 6l-6 6 6 6"></path></svg></button>
<button type="button" class="lb-btn" aria-label="Next image" onClick="{{next}}" style="position: absolute; right: 32px; top: 50%; margin-top: -28px; width: 56px; height: 56px; display: inline-flex; align-items: center; justify-content: center; background: rgba(5,6,10,0.6); border: 1px solid rgba(0,240,255,0.35); color: #00F0FF"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"></path></svg></button>
</sc-if>
<figure class="lb-in" style="margin: 0; width: 100%; max-width: {{figMax}}px; height: 100%; display: flex; flex-direction: column; gap: 12px">
<div role="img" aria-label="{{cur.alt}}" style="flex: 1; min-height: 0; position: relative; overflow: hidden; background: {{cur.full}}; border: 1px solid rgba(0,240,255,0.25); box-shadow: 0 0 40px rgba(0,240,255,0.12)">
<span aria-hidden="true" style="position: absolute; top: 8px; left: 8px; width: 18px; height: 18px; border-top: 2px solid #00F0FF; border-left: 2px solid #00F0FF"></span>
<span aria-hidden="true" style="position: absolute; bottom: 8px; right: 8px; width: 18px; height: 18px; border-bottom: 2px solid #00F0FF; border-right: 2px solid #00F0FF"></span>
</div>
<figcaption style="flex: none; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; font-family: 'JetBrains Mono', monospace">
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 10px; letter-spacing: 0.14em; color: {{cur.catC}}">{{cur.cat}}</span><span style="font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: {{capFs}}px; letter-spacing: 0.06em; text-transform: uppercase">{{cur.title}}</span><span style="font-size: 11px; letter-spacing: 0.1em; color: #8A93A8">{{cur.meta}}</span></span>
<sc-if value="{{desktop}}" hint-placeholder-val="{{ true }}"><span style="font-size: 11px; letter-spacing: 0.12em; color: #8A93A8">© [PHOTOGRAPHER] · [LICENCE]</span></sc-if>
</figcaption>
</figure>
</div>
<div style="flex: none; padding: 12px {{lbPadX}}px {{thBottom}}px; display: flex; gap: {{thGap}}px; justify-content: center; border-top: 1px solid rgba(0,240,255,0.12)">
<sc-for list="{{all}}" as="g" hint-placeholder-count="9">
<sc-if value="{{showThumbs}}" hint-placeholder-val="{{ true }}">
<button type="button" class="lb-th" aria-label="View image {{g.num}}" aria-current="{{g.curStr}}" onClick="{{g.open}}" style="width: 64px; height: 44px; padding: 0; background: {{g.scene}}; border: 1px solid {{g.thBorder}}; opacity: {{g.thOp}}; box-shadow: {{g.thGlow}}"></button>
</sc-if>
<sc-if value="{{mobile}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="width: {{g.dotW}}px; height: 4px; background: {{g.dotC}}; transition: width 300ms cubic-bezier(.16,1,.3,1)"></span></sc-if>
</sc-for>
</div>
</div>
</sc-if>
</section>
</x-dc>
