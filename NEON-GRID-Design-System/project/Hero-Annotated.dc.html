<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hero — desktop, motion annotations</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&amp;family=Rajdhani:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#05060A}</style>
</helmet>
<div style="width: 1900px; height: 900px; overflow: hidden; background: #05060A">
<dc-import name="Hero" mobile="{{m}}" annotate="{{a}}" hint-size="1900px,900px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1900,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return { m: false, a: true }; }
}
</script>
</body>
</html>
