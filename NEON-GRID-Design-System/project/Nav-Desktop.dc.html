<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Navigation — desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&amp;family=Rajdhani:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#05060A}
.ng-noise{position:absolute;inset:0;pointer-events:none;background-image:url(/_blob/4471ec4b76afa1f4abfdc8c2ea75b053);background-size:240px;opacity:.03;z-index:30}
.ng-scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(232,241,255,.04) 0 2px,transparent 2px 4px);z-index:29}
.nd-floor{position:absolute;left:-30%;right:-30%;bottom:-40px;height:420px;background-image:linear-gradient(rgba(0,240,255,.32) 1px,transparent 1px),linear-gradient(90deg,rgba(0,240,255,.32) 1px,transparent 1px);background-size:64px 64px;transform:perspective(520px) rotateX(64deg);transform-origin:50% 100%;-webkit-mask-image:linear-gradient(to top,#000 5%,transparent 80%);mask-image:linear-gradient(to top,#000 5%,transparent 80%)}
.nd-bar{transition:background 300ms cubic-bezier(.16,1,.3,1),height 300ms cubic-bezier(.16,1,.3,1),border-color 300ms,backdrop-filter 300ms,box-shadow 300ms}
.nd-link{position:relative;transition:color 150ms cubic-bezier(.16,1,.3,1)}
.nd-link::after{content:"";position:absolute;left:16px;right:16px;bottom:6px;height:2px;background:#00F0FF;box-shadow:0 0 8px #00F0FF;transform:scaleX(0);transform-origin:left;transition:transform 300ms cubic-bezier(.16,1,.3,1)}
.nd-link:hover{color:#E8F1FF !important}
.nd-link:hover::after,.nd-link[aria-current="page"]::after{transform:scaleX(1)}
.nd-link:hover .nd-g{animation:ng-glitch 200ms steps(4) 1}
.nd-link:focus-visible,.nd-logo:focus-visible{outline:2px solid #00F0FF;outline-offset:2px;box-shadow:0 0 8px #00F0FF,0 0 24px rgba(0,240,255,.5)}
.nd-g{display:inline-block}
@keyframes ng-glitch{0%{text-shadow:-2px 0 #00F0FF,2px 0 #FF2A6D;transform:translate(0,0)}25%{text-shadow:3px 0 #00F0FF,-3px 0 #FF2A6D;transform:translate(-2px,1px)}50%{text-shadow:-3px 0 #00F0FF,2px 0 #FF2A6D;transform:translate(2px,-1px)}75%{text-shadow:2px 0 #00F0FF,-2px 0 #FF2A6D;transform:translate(-1px,0)}100%{text-shadow:none;transform:none}}
.bw{display:inline-flex;transition:filter 150ms cubic-bezier(.16,1,.3,1)}
.bw:hover{filter:drop-shadow(0 0 8px #FF2A6D) drop-shadow(0 0 16px rgba(255,42,109,.5))}
.bw:focus-within{outline:2px solid #00F0FF;outline-offset:3px;filter:drop-shadow(0 0 8px rgba(0,240,255,.6))}
.b-pri{cursor:pointer;transition:background 150ms cubic-bezier(.16,1,.3,1),transform 150ms}
.b-pri:hover{background:#FF4D85 !important}
.b-pri:active{background:#D91E5B !important;transform:translateY(1px)}
.b-pri:focus{outline:none}
.colon{animation:ng-blink 1s steps(1) infinite}
@keyframes ng-blink{0%,50%{opacity:1}50.01%,100%{opacity:.25}}
.pulse{position:relative}
.pulse::after{content:"";position:absolute;inset:0;border-radius:50%;background:inherit;animation:ng-pulse 1200ms cubic-bezier(.16,1,.3,1) infinite}
@keyframes ng-pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.8);opacity:0}}
.nd-scroll::-webkit-scrollbar{width:6px}.nd-scroll::-webkit-scrollbar-thumb{background:rgba(0,240,255,.3)}
@media (prefers-reduced-motion:reduce){.nd-bar,.nd-link::after{transition:opacity 300ms}.nd-link:hover .nd-g,.colon,.pulse::after{animation:none}.b-pri:active{transform:none}}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #05060A; color: #E8F1FF; font-family: 'Rajdhani', 'Inter', system-ui, sans-serif; font-size: 16px; line-height: 1.6">
<div class="ng-scan"></div>
<div class="ng-noise"></div>

<!-- PAGE (scrolls under the bar) -->
<div class="nd-scroll" onScroll="{{onScroll}}" style="position: absolute; inset: 0; overflow-y: {{overflow}}; overflow-x: hidden">
<div style="transform: translateY({{offset}}px)">
<section style="height: 900px; position: relative; overflow: hidden">
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 560px; background: linear-gradient(to top, rgba(255,42,109,0.32), rgba(123,44,255,0.08) 45%, rgba(5,6,10,0) 80%)"></div>
<div aria-hidden="true" class="nd-floor"></div>
<div aria-hidden="true" style="position: absolute; left: 50%; top: 260px; width: 520px; height: 520px; margin-left: -260px; border-radius: 50%; background: radial-gradient(circle, rgba(0,240,255,0.14), rgba(0,240,255,0) 65%)"></div>
<div style="position: absolute; left: 80px; right: 80px; top: 300px; display: flex; flex-direction: column; gap: 20px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.16em; color: #00F0FF">SECTOR 07 // [HERO EYEBROW]</span>
<h1 style="margin: 0; font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 96px; line-height: 1; letter-spacing: 0.08em; text-transform: uppercase; text-shadow: 0 0 8px #00F0FF, 0 0 24px rgba(0,240,255,0.5)">Enter the grid</h1>
<p style="margin: 0; max-width: 560px; font-size: 20px; color: #8A93A8">[Hero copy: one or two lines about the world.]</p>
<span style="margin-top: 24px; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.16em; color: #8A93A8">{{scrollHint}}</span>
</div>
<div aria-hidden="true" style="position: absolute; right: 80px; top: 300px; width: 380px; height: 380px; border: 1px solid rgba(0,240,255,0.15); display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8A93A8">[3D SCENE]</div>
</section>
<section style="padding: 96px 80px; display: flex; flex-direction: column; gap: 32px; border-top: 1px solid rgba(0,240,255,0.12)">
<div style="display: flex; align-items: center; gap: 24px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 14px; letter-spacing: 0.12em; color: #00F0FF">01 / DISTRICTS</span>
<span style="flex: 1; height: 1px; background: linear-gradient(90deg, rgba(0,240,255,0.6), rgba(0,240,255,0.12) 40%, rgba(0,240,255,0))"></span>
</div>
<h2 style="margin: 0; font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 56px; letter-spacing: 0.08em; text-transform: uppercase">Choose your turf</h2>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="6">
<div style="height: 300px; background: #0B0E17; border: 1px solid rgba(0,240,255,0.12); display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; gap: 4px; background-image: linear-gradient(to top, rgba(255,42,109,0.18), rgba(11,14,23,0) 60%); clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px))">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; color: #00F0FF">SECTOR {{c.n}}</span>
<span style="font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: 0.08em">[DISTRICT NAME]</span>
</div>
</sc-for>
</div>
</section>
</div>
</div>

<!-- NAV BAR -->
<div aria-hidden="true" style="position: absolute; z-index: 9; left: 0; right: 0; top: 0; height: 160px; pointer-events: none; background: linear-gradient(to bottom, rgba(5,6,10,0.75), rgba(5,6,10,0)); opacity: {{scrimOp}}; transition: opacity 300ms"></div>
<header class="nd-bar" style="position: absolute; z-index: 10; left: 0; right: 0; top: 0; height: {{barH}}px; padding: 0 40px; box-sizing: border-box; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 32px; background: {{barBg}}; backdrop-filter: {{blur}}; -webkit-backdrop-filter: {{blur}}; border-bottom: 1px solid {{barBorder}}; box-shadow: {{barShadow}}">
<a href="#" class="nd-logo" aria-label="NEON//GRID home" style="justify-self: start; height: 44px; display: inline-flex; align-items: center; gap: 12px; text-decoration: none; color: #E8F1FF">
<span aria-hidden="true" style="width: 28px; height: 28px; position: relative; display: inline-block; border: 1px solid #00F0FF; transform: rotate(45deg); box-shadow: 0 0 8px rgba(0,240,255,0.6)"><span style="position: absolute; inset: 6px; background: #FF2A6D"></span></span>
<span style="font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 20px; letter-spacing: 0.08em">NEON<span style="color: #FF2A6D">//</span>GRID</span>
</a>
<nav aria-label="Main" style="display: flex; gap: 4px">
<sc-for list="{{links}}" as="l" hint-placeholder-count="5">
<a href="#" class="nd-link" aria-current="{{l.current}}" style="height: 44px; padding: 0 16px; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: {{l.color}}; font-weight: 600; font-size: 16px; letter-spacing: 0.1em; text-transform: uppercase"><span aria-hidden="true" style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.06em; color: {{l.idxColor}}; align-self: flex-start; margin-top: 8px">{{l.n}}</span><span class="nd-g">{{l.label}}</span></a>
</sc-for>
</nav>
<div style="justify-self: end; display: flex; align-items: center; gap: 24px">
<span role="timer" aria-label="Neo-Tokyo local time {{hh}}:{{mm}}" style="display: inline-flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.14em; white-space: nowrap">
<span class="pulse" aria-hidden="true" style="width: 6px; height: 6px; border-radius: 50%; background: #2BFF88"></span>
<span style="color: #8A93A8">NEO-TOKYO</span>
<span aria-hidden="true" style="color: #E8F1FF">{{hh}}<span class="colon">:</span>{{mm}}</span>
</span>
<span class="bw"><a href="#" class="b-pri" style="height: 44px; padding: 0 24px; display: inline-flex; align-items: center; gap: 10px; text-decoration: none; background: #FF2A6D; color: #05060A; font-weight: 700; font-size: 16px; letter-spacing: 0.1em; text-transform: uppercase; clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px))">Jack in<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"></path></svg></a></span>
</div>
<div aria-hidden="true" style="position: absolute; left: 0; bottom: -1px; height: 2px; width: {{progress}}; background: linear-gradient(90deg, #7B2CFF, #FF2A6D, #00F0FF); box-shadow: 0 0 8px rgba(0,240,255,0.6); opacity: {{progOp}}"></div>
</header>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["live","top","scrolled"],"default":"live"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { y: 0, now: Date.now() }; this.t = null; }
  componentDidMount() { var self = this; this.t = setInterval(function () { self.setState({ now: Date.now() }); }, 1000); }
  componentWillUnmount() { if (this.t) clearInterval(this.t); }
  renderVals() {
    var self = this;
    var mode = this.props.mode ?? 'live';
    var live = mode === 'live';
    var y = live ? this.state.y : (mode === 'scrolled' ? 520 : 0);
    var scrolled = y > 24;
    var maxY = 900;
    var hh = '23', mm = '41';
    try {
      var parts = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Tokyo', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(new Date(this.state.now));
      parts.forEach(function (p) { if (p.type === 'hour') hh = p.value; if (p.type === 'minute') mm = p.value; });
    } catch (e) {}
    var names = ['Districts', 'Augments', 'Characters', 'Lore', 'Gallery'];
    var cards = []; for (var i = 1; i <= 6; i++) cards.push({ n: '0' + i });
    return {
      overflow: live ? 'auto' : 'hidden',
      offset: live ? 0 : -y,
      onScroll: function (e) { if (live) self.setState({ y: e.currentTarget.scrollTop }); },
      scrollHint: live ? 'SCROLL ↓ TO SEE THE BAR TURN TO GLASS' : 'SCROLL ↓',
      barH: scrolled ? 64 : 88,
      barBg: scrolled ? 'rgba(11,14,23,0.6)' : 'rgba(11,14,23,0)',
      blur: scrolled ? 'blur(16px)' : 'none',
      barBorder: scrolled ? 'rgba(0,240,255,0.15)' : 'rgba(0,240,255,0)',
      barShadow: scrolled ? '0 12px 32px rgba(0,0,0,0.45)' : 'none',
      scrimOp: scrolled ? 0 : 1,
      progress: Math.min(100, Math.round(y / maxY * 100)) + '%',
      progOp: scrolled ? 1 : 0,
      hh: hh, mm: mm,
      cards: cards,
      links: names.map(function (n, i) {
        var cur = i === 0;
        return { n: '0' + (i + 1), label: n, current: cur ? 'page' : 'false', color: cur ? '#00F0FF' : '#8A93A8', idxColor: cur ? '#00F0FF' : 'rgba(138,147,168,0.7)' };
      })
    };
  }
}
</script>
</body>
</html>
