<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Navigation — mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&amp;family=Rajdhani:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#05060A}
.ng-noise{position:absolute;inset:0;pointer-events:none;background-image:url(/_blob/4471ec4b76afa1f4abfdc8c2ea75b053);background-size:240px;opacity:.03;z-index:60}
.ng-scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(232,241,255,.04) 0 2px,transparent 2px 4px);z-index:59}
.nm-floor{position:absolute;left:-60%;right:-60%;bottom:-30px;height:300px;background-image:linear-gradient(rgba(0,240,255,.32) 1px,transparent 1px),linear-gradient(90deg,rgba(0,240,255,.32) 1px,transparent 1px);background-size:40px 40px;transform:perspective(360px) rotateX(62deg);transform-origin:50% 100%;-webkit-mask-image:linear-gradient(to top,#000 5%,transparent 80%);mask-image:linear-gradient(to top,#000 5%,transparent 80%)}
.hb{cursor:pointer;transition:border-color 300ms cubic-bezier(.16,1,.3,1),box-shadow 300ms cubic-bezier(.16,1,.3,1),background 150ms}
.hb:hover{background:rgba(0,240,255,.1) !important}
.hb:focus-visible,.nm-link:focus-visible,.soc:focus-visible{outline:2px solid #00F0FF;outline-offset:3px;box-shadow:0 0 8px #00F0FF,0 0 24px rgba(0,240,255,.5)}
.hb-bar{transition:transform 300ms cubic-bezier(.16,1,.3,1),opacity 150ms,width 300ms cubic-bezier(.16,1,.3,1)}
.nm-ov{animation:nm-reveal 600ms cubic-bezier(.16,1,.3,1) 1 both}
@keyframes nm-reveal{from{clip-path:inset(0 0 100% 0);opacity:.4}to{clip-path:inset(0 0 0 0);opacity:1}}
.nm-item{animation:nm-slide 600ms cubic-bezier(.16,1,.3,1) 1 both}
@keyframes nm-slide{from{opacity:0;transform:translateX(32px)}to{opacity:1;transform:none}}
.nm-link{transition:color 150ms,background 150ms}
.nm-link:hover,.nm-link:focus-visible{background:rgba(0,240,255,.05)}
.nm-link:hover .nm-g,.nm-link:focus-visible .nm-g{animation:ng-glitch 200ms steps(4) 2;color:#E8F1FF}
.nm-link .nm-arrow{opacity:0;transform:translateX(-8px);transition:opacity 150ms,transform 300ms cubic-bezier(.16,1,.3,1)}
.nm-link:hover .nm-arrow,.nm-link:focus-visible .nm-arrow{opacity:1;transform:none}
.nm-g{display:inline-block}
@keyframes ng-glitch{0%{text-shadow:-2px 0 #00F0FF,2px 0 #FF2A6D;transform:translate(0,0)}25%{text-shadow:3px 0 #00F0FF,-3px 0 #FF2A6D;transform:translate(-2px,1px)}50%{text-shadow:-3px 0 #00F0FF,2px 0 #FF2A6D;transform:translate(2px,-1px) skewX(-4deg)}75%{text-shadow:2px 0 #00F0FF,-2px 0 #FF2A6D;transform:translate(-1px,0)}100%{text-shadow:none;transform:none}}
.soc{cursor:pointer;transition:all 150ms cubic-bezier(.16,1,.3,1)}
.soc:hover{border-color:#00F0FF !important;color:#E8F1FF !important;box-shadow:0 0 8px #00F0FF,0 0 24px rgba(0,240,255,.5)}
.b-pri{cursor:pointer;transition:background 150ms}
.b-pri:hover{background:#FF4D85 !important}
.colon{animation:ng-blink 1s steps(1) infinite}
@keyframes ng-blink{0%,50%{opacity:1}50.01%,100%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.nm-ov,.nm-item{animation:ng-fade 300ms ease 1 both}@keyframes ng-fade{from{opacity:0}to{opacity:1}}.hb-bar{transition:opacity 150ms}.nm-link:hover .nm-g,.nm-link:focus-visible .nm-g,.colon{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #05060A; color: #E8F1FF; font-family: 'Rajdhani', 'Inter', system-ui, sans-serif; font-size: 16px; line-height: 1.6">
<div class="ng-scan"></div>
<div class="ng-noise"></div>

<!-- PAGE BEHIND -->
<div aria-hidden="{{openStr}}" style="position: absolute; inset: 0">
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 420px; background: linear-gradient(to top, rgba(255,42,109,0.32), rgba(123,44,255,0.08) 45%, rgba(5,6,10,0) 80%)"></div>
<div aria-hidden="true" class="nm-floor"></div>
<div style="position: absolute; left: 16px; right: 16px; top: 180px; display: flex; flex-direction: column; gap: 16px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.16em; color: #00F0FF">SECTOR 07 // [HERO EYEBROW]</span>
<h1 style="margin: 0; font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 40px; line-height: 1.05; letter-spacing: 0.08em; text-transform: uppercase; text-shadow: 0 0 8px #00F0FF, 0 0 24px rgba(0,240,255,0.5)">Enter the grid</h1>
<p style="margin: 0; font-size: 17px; color: #8A93A8">[Hero copy: one or two lines about the world.]</p>
<a href="#" class="b-pri" style="margin-top: 8px; align-self: flex-start; height: 48px; padding: 0 24px; display: inline-flex; align-items: center; text-decoration: none; background: #FF2A6D; color: #05060A; font-weight: 700; font-size: 16px; letter-spacing: 0.1em; text-transform: uppercase; clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px))">Jack in</a>
</div>
</div>

<!-- HEADER (closed) -->
<header style="position: absolute; z-index: 20; left: 0; right: 0; top: 0; height: 64px; padding: 0 10px 0 16px; display: flex; align-items: center; justify-content: space-between; background: rgba(11,14,23,0.6); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid rgba(0,240,255,0.15)">
<a href="#" aria-label="NEON//GRID home" style="height: 44px; display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: #E8F1FF">
<span aria-hidden="true" style="width: 20px; height: 20px; position: relative; display: inline-block; border: 1px solid #00F0FF; transform: rotate(45deg); box-shadow: 0 0 8px rgba(0,240,255,0.6)"><span style="position: absolute; inset: 4px; background: #FF2A6D"></span></span>
<span style="font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 16px; letter-spacing: 0.08em">NEON<span style="color: #FF2A6D">//</span>GRID</span>
</a>
</header>

<!-- OVERLAY -->
<sc-if value="{{open}}" hint-placeholder-val="{{ false }}">
<div class="nm-ov" role="dialog" aria-modal="true" aria-label="Site menu" style="position: absolute; z-index: 30; inset: 0; background: rgba(5,6,10,0.96); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); display: flex; flex-direction: column">
<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 100% 0%, rgba(123,44,255,0.22), rgba(5,6,10,0) 55%), linear-gradient(to top, rgba(255,42,109,0.16), rgba(5,6,10,0) 40%)"></div>
<div style="height: 64px; padding: 0 10px 0 16px; display: flex; align-items: center; border-bottom: 1px solid rgba(0,240,255,0.15); position: relative">
<span style="display: inline-flex; align-items: center; gap: 10px"><span aria-hidden="true" style="width: 20px; height: 20px; position: relative; display: inline-block; border: 1px solid #FF2A6D; transform: rotate(45deg); box-shadow: 0 0 8px rgba(255,42,109,0.6)"><span style="position: absolute; inset: 4px; background: #00F0FF"></span></span><span style="font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 16px; letter-spacing: 0.08em">NEON<span style="color: #FF2A6D">//</span>GRID</span></span>
</div>
<div style="position: relative; padding: 16px 16px 8px; display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.16em; color: #8A93A8">
<span>MENU // 05 NODES</span><span style="color: #00F0FF">SECTOR 07</span>
</div>
<nav aria-label="Main" style="position: relative; padding: 0 16px; display: flex; flex-direction: column">
<sc-for list="{{links}}" as="l" hint-placeholder-count="5">
<a href="#" class="nm-link nm-item" aria-current="{{l.current}}" style="min-height: 84px; padding: 8px 4px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 8px; text-decoration: none; color: {{l.color}}; border-bottom: 1px solid rgba(0,240,255,0.12); animation-delay: {{l.delay}}">
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; color: {{l.idxColor}}">{{l.n}}<span aria-hidden="true" style="width: 24px; height: 1px; background: {{l.idxColor}}"></span>{{l.meta}}</span>
<span class="nm-g" style="font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 34px; line-height: 1.1; letter-spacing: 0.04em; text-transform: uppercase; text-shadow: {{l.glow}}">{{l.label}}</span>
</span>
<svg class="nm-arrow" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FF2A6D" stroke-width="2" aria-hidden="true" style="flex: none"><path d="M4 12h15M13 6l6 6-6 6"></path></svg>
</a>
</sc-for>
</nav>
<div style="position: relative; margin-top: auto; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 16px">
<a href="#" class="b-pri nm-item" style="height: 52px; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; background: #FF2A6D; color: #05060A; font-weight: 700; font-size: 17px; letter-spacing: 0.12em; text-transform: uppercase; animation-delay: 360ms; clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px))">Jack in<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"></path></svg></a>
<div class="nm-item" style="display: flex; justify-content: space-between; animation-delay: 420ms">
<sc-for list="{{socials}}" as="s" hint-placeholder-count="5">
<a href="#" class="soc" aria-label="{{s.name}}" style="width: 56px; height: 44px; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; border: 1px solid rgba(0,240,255,0.3); color: #00F0FF; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.08em">{{s.abbr}}</a>
</sc-for>
</div>
<div class="nm-item" style="display: flex; justify-content: space-between; align-items: center; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; color: #8A93A8; animation-delay: 480ms">
<span role="timer" aria-label="Neo-Tokyo local time {{hh}}:{{mm}}" style="display: inline-flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 50%; background: #2BFF88; box-shadow: 0 0 6px #2BFF88"></span>NEO-TOKYO <span aria-hidden="true" style="color: #E8F1FF">{{hh}}<span class="colon">:</span>{{mm}}</span></span>
<span>© [YEAR] [STUDIO NAME]</span>
</div>
</div>
</div>
</sc-if>

<!-- HAMBURGER (sits above the overlay and morphs into X) -->
<button type="button" class="hb" onClick="{{toggle}}" aria-label="{{hbLabel}}" aria-expanded="{{openStr}}" style="position: absolute; z-index: 40; top: 10px; right: 10px; width: 44px; height: 44px; padding: 0; background: transparent; border: 1px solid {{hbBorder}}; box-shadow: {{hbGlow}}">
<span class="hb-bar" aria-hidden="true" style="position: absolute; left: 11px; top: 21px; width: 20px; height: 2px; background: {{hbColor}}; transform: {{t1}}"></span>
<span class="hb-bar" aria-hidden="true" style="position: absolute; left: 11px; top: 21px; width: {{midW}}; height: 2px; background: {{hbColor}}; transform: {{t2}}; opacity: {{midOp}}"></span>
<span class="hb-bar" aria-hidden="true" style="position: absolute; left: 11px; top: 21px; width: 20px; height: 2px; background: {{hbColor}}; transform: {{t3}}"></span>
</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"open":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: null, now: Date.now() }; this.t = null; }
  componentDidMount() { var self = this; this.t = setInterval(function () { self.setState({ now: Date.now() }); }, 1000); }
  componentWillUnmount() { if (this.t) clearInterval(this.t); }
  renderVals() {
    var self = this;
    var open = this.state.open === null ? !!(this.props.open ?? false) : this.state.open;
    var hh = '23', mm = '41';
    try {
      var parts = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Tokyo', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(new Date(this.state.now));
      parts.forEach(function (p) { if (p.type === 'hour') hh = p.value; if (p.type === 'minute') mm = p.value; });
    } catch (e) {}
    var names = [['Districts', '06 ZONES'], ['Augments', 'SHOP'], ['Characters', 'CREW'], ['Lore', 'ARCHIVE'], ['Gallery', 'MEDIA']];
    return {
      open: open,
      openStr: open ? 'true' : 'false',
      toggle: function () { self.setState({ open: !open }); },
      hbLabel: open ? 'Close menu' : 'Open menu',
      hbBorder: open ? '#00F0FF' : 'rgba(0,240,255,0.3)',
      hbGlow: open ? '0 0 8px #00F0FF, 0 0 24px rgba(0,240,255,0.5)' : 'none',
      hbColor: '#00F0FF',
      t1: open ? 'rotate(45deg)' : 'translateY(-7px)',
      t2: open ? 'scaleX(0)' : 'translateX(6px)',
      t3: open ? 'rotate(-45deg)' : 'translateY(7px)',
      midW: open ? '20px' : '14px',
      midOp: open ? 0 : 1,
      hh: hh, mm: mm,
      links: names.map(function (n, i) {
        var cur = i === 0;
        return { n: '0' + (i + 1), label: n[0], meta: n[1], current: cur ? 'page' : 'false', color: cur ? '#00F0FF' : '#E8F1FF', idxColor: cur ? '#00F0FF' : '#8A93A8', glow: cur ? '0 0 8px #00F0FF, 0 0 24px rgba(0,240,255,0.5)' : 'none', delay: (60 + i * 60) + 'ms' };
      }),
      socials: [
        { abbr: 'X', name: 'X (Twitter)' }, { abbr: 'DC', name: 'Discord' }, { abbr: 'YT', name: 'YouTube' },
        { abbr: 'IG', name: 'Instagram' }, { abbr: 'TW', name: 'Twitch' }
      ]
    };
  }
}
</script>
</body>
</html>
